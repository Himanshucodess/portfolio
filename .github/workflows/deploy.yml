name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy build to EC2
        run: |
          tar czf release.tgz -C dist .
          scp -i ~/.ssh/ec2.pem release.tgz "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/release.tgz"

      - name: Activate release on EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            set -e
            mkdir -p /home/ubuntu/profile-release
            tar xzf /home/ubuntu/release.tgz -C /home/ubuntu/profile-release
            sudo mkdir -p /var/www/portfolio
            sudo rsync -a --delete /home/ubuntu/profile-release/ /var/www/portfolio/
            sudo nginx -t
            sudo systemctl reload nginx
            echo DEPLOY_OK
          "
