server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/portfolio;
    index index.html;

    server_name himanshusingh.tech;

    # NOTE: TLS (443 + http→https redirect) is managed on the server by
    # certbot --nginx. Don't overwrite /etc/nginx/sites-enabled/portfolio
    # with this file after certs exist — it would drop the 443 block.

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # static caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
